<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="opt1_grad_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="opt1_grad_teal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="opt1_grad_arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(15, 10)">
    <!-- Outer Orbit Ring 1 -->
    <circle cx="50" cy="50" r="44" stroke="url(#opt1_grad_teal)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="190 70" />
    
    <!-- Outer Orbit Ring 2 with Node -->
    <circle cx="50" cy="50" r="37" stroke="url(#opt1_grad_green)" stroke-width="3" stroke-linecap="round" stroke-dasharray="140 80" />
    <circle cx="16" cy="50" r="4.5" fill="#10b981" />
    <circle cx="16" cy="50" r="2" fill="#ffffff" />
    <circle cx="75" cy="77" r="4" fill="#0d9488" />
    <circle cx="75" cy="77" r="1.8" fill="#ffffff" />

    <!-- Stylized 'S' Core -->
    <path d="M 64 28 C 58 21, 40 21, 34 29 C 27 37, 28 50, 48 53 C 68 56, 68 70, 60 78 C 51 86, 33 86, 26 77" 
          stroke="url(#opt1_grad_green)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrow Piercing Through Upper Right -->
    <path d="M 36 68 L 78 26" stroke="url(#opt1_grad_arrow)" stroke-width="7" stroke-linecap="round" />
    <polygon points="73,14 91,24 81,42" fill="url(#opt1_grad_arrow)" />
  </g>

  <!-- WORDMARK: sebaraja -->
  <g transform="translate(135, 76)">
    <!-- 'sebar' in Vibrant Emerald -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#059669" letter-spacing="-1.5">
      sebar
    </text>
    
    <!-- 'aja' in Deep Slate Tech Navy -->
    <text x="146" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-1.5">
      aja
    </text>

    <!-- Sparkle over 'j' -->
    <circle cx="218" cy="-52" r="4.5" fill="#0d9488" />
    <path d="M 218 -62 L 218 -58 M 218 -46 L 218 -42 M 210 -52 L 214 -52 M 222 -52 L 226 -52" 
          stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

