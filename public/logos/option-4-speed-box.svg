<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="opt4_grad_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="opt4_grad_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="opt4_grad_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="opt4_grad_signal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM: ISOMETRIC INVENTORY BOX + BROADCAST WAVES -->
  <g transform="translate(18, 14)">
    <!-- Broadcast Waves Rising from Box -->
    <path d="M 33 26 A 18 18 0 0 1 65 26" stroke="url(#opt4_grad_signal)" stroke-width="3" stroke-linecap="round" />
    <path d="M 26 18 A 28 28 0 0 1 72 18" stroke="url(#opt4_grad_signal)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.8" />
    <circle cx="49" cy="30" r="3" fill="#38bdf8" />

    <!-- Isometric Box Top Face -->
    <polygon points="49,36 78,49 49,63 20,49" fill="url(#opt4_grad_top)" />

    <!-- Isometric Box Left Face -->
    <polygon points="20,49 49,63 49,94 20,80" fill="url(#opt4_grad_left)" />

    <!-- Isometric Box Right Face -->
    <polygon points="49,63 78,49 78,80 49,94" fill="url(#opt4_grad_right)" />

    <!-- Dynamic Lightning / Gear Slit on Front Edge -->
    <path d="M 49 63 L 49 94" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <path d="M 36 62 L 31 75 L 39 75 L 34 88" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- WORDMARK: sebaraja -->
  <g transform="translate(132, 74)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="50" font-weight="900" fill="#0f172a" letter-spacing="-1.5">
      sebar<tspan fill="#0d9488">aja</tspan>
    </text>
    <rect x="2" y="14" width="70" height="3" rx="1.5" fill="#10b981" />
    <text x="82" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#64748b" letter-spacing="2.5">
      SMART RENTAL
    </text>
  </g>
</svg>

