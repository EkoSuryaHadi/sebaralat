<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="opt3_grad_inf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="opt3_grad_inf2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM: INFINITY RENTAL LOOP -->
  <g transform="translate(18, 15)">
    <!-- Shadow Glow Base -->
    <ellipse cx="48" cy="78" rx="36" ry="7" fill="#0f172a" opacity="0.08" />

    <!-- Infinity Left Loop (Rent out) -->
    <path d="M 48 46 C 36 26, 12 28, 12 46 C 12 64, 34 66, 48 46" 
          stroke="url(#opt3_grad_inf1)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Infinity Right Loop (Return & Ready) with Forward Arrowhead -->
    <path d="M 48 46 C 62 26, 84 28, 84 46 C 84 64, 62 66, 48 46" 
          stroke="url(#opt3_grad_inf2)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Directional circulation dots -->
    <circle cx="21" cy="46" r="3" fill="#ffffff" />
    <circle cx="75" cy="46" r="3" fill="#ffffff" />

    <!-- Center Lightning / Bolt Accent -->
    <path d="M 50 33 L 44 48 L 53 48 L 47 61" 
          stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- WORDMARK: sebaraja -->
  <g transform="translate(132, 75)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="50" font-weight="800" fill="#0f172a" letter-spacing="-1.5">
      sebar<tspan fill="#059669">aja</tspan><tspan fill="#10b981">.</tspan>
    </text>
    <text x="3" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#10b981" letter-spacing="3">
      INSTANT EQUIPMENT CATALOG
    </text>
  </g>
</svg>

